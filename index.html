<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Карточка товара</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <div class="card__header">
            <img class="card__img" src="https://habrastorage.org/r/w1560/getpro/habr/upload_files/a07/c6d/868/a07c6d86819c0b7496ec422f20df13e8.png" alt="Картинка">
            
            <div class="card__actions">
                <button class="card__btn-action">❤️</button>
                <button class="card__btn-action">🛒</button>
                <button class="card__btn-action">👁️</button>
            </div>
        </div>

        <div class="card__body">
            <div class="card__row">
                <span class="card__category">Backend development</span>
                <span class="card__rating">★ 3'4</span>
            </div>

            <h2 class="card__title">Backend</h2>
            
            <p class="card__desc">
                Мы научим тебя писать бекенд
            </p>

            <div class="card__sales">Продажи не сосчитать</div>

            <div class="card__price">
                <span class="card__price-old">1 млн. руб.</span>
                <span class="card__price-new">53.43 руб.</span>
            </div>

            <button class="card__button">Узнать больше></button>
        </div>
    </div>

</body>
</html>
